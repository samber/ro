version: 2
updates:
  - package-ecosystem: github-actions
    cooldown:
      default-days: 7
    directory: /
    schedule:
      interval: monthly

  - package-ecosystem: gomod
    cooldown:
      default-days: 7
      semver-major-days: 30
    directories:
      - /
      - /ee/**
      - /plugins/**
    schedule:
      interval: weekly

  - package-ecosystem: npm
    cooldown:
      default-days: 7
      semver-major-days: 30
    directory: /docs
    schedule:
      interval: monthly
    ignore:
      - dependency-name: '*'
        update-types: ["version-update:semver-patch"]
    groups:
      docusaurus:
        patterns:
          - "@docusaurus/*"
      react:
        patterns:
          - "react"
          - "react-dom"