name: Tests (SIMD)

on:
  push:
    branches:
      - main
    paths:
      - 'plugins/exp/simd/**'
  pull_request:
    paths:
      - 'plugins/exp/simd/**'

env:
  GOEXPERIMENT: simd
  GOWORK: off

# One run per workflow and ref: a new push to a pull request cancels the run still in progress.
# Runs on main, scheduled and manual runs are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-simd:
    # GitHub hosted runners run on several architectures.
    # Using Ubicloud ensures we run on AVX512.
    runs-on: ubicloud-standard-2
    strategy:
      fail-fast: false
      matrix:
        go:
          - "stable"

    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}

      - name: Prepare enterprise license for CI
        run: |
          cp ee/fixtures/license/private.ci.key ee/pkg/license/private.key
          cp ee/fixtures/license/public.ci.key ee/pkg/license/public.key

      - name: Test
        run: make test

      - name: Benchmark
        run: |
          cd plugins/exp/simd/
          GOWORK=off GOEXPERIMENT=simd go test -run=^Benchmark -benchmem -bench ./...
