name: Tests

on:
  push:
    branches:
      - main
  pull_request:

# One run per workflow and ref: a new push to a pull request cancels the run still in progress.
# Runs on main, scheduled and manual runs are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go:
          - "1.18"
          - "1.19"
          - "1.20"
          - "1.21"
          - "1.22"
          - "1.23"
          - "1.24"
          - "1.25"
          - "1.26"
          - "stable"

    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
  
      - name: Prepare enterprise license for CI
        run: |
          cp ee/fixtures/license/private.ci.key ee/pkg/license/private.key
          cp ee/fixtures/license/public.ci.key ee/pkg/license/public.key

      - name: Build
        run: make build

      - name: Test
        run: |
          make test || make test

      # Skipped on draft pull requests: fuzzing is slow and only needed once the change is ready for review.
      - name: Fuzz
        run: make fuzz RO_FUZZ_ITERATIONS=100
        if: matrix.go == 'stable' && (github.event_name != 'pull_request' || !github.event.pull_request.draft)

      - name: Test coverage
        run: make coverage
        if: matrix.go == 'stable'

      - name: Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: unittests
          verbose: true
        if: matrix.go == 'stable'
