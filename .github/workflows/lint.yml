name: Lint

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch: # Allow manual trigger

# One run per workflow and ref: a new push to a pull request cancels the run still in progress.
# Runs on main, scheduled and manual runs are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          args: --timeout 120s --max-same-issues 50 --config=.golangci.yml

      # - name: Install mdsf
      #   uses: hougesen/mdsf@main

      # - name: Run mdsf
      #   run: mdsf --debug --log-level warn docs/
